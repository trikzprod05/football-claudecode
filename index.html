<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Clip Desk</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e4e6f0;--muted:#8b8fa3;--accent:#e8457f;--accent2:#5b6af0;--success:#3dd68c;--danger:#ff5c5c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#1a1d27 0%,#2a1a2e 100%);padding:24px 20px;border-bottom:1px solid var(--border)}
.header h1{font-size:24px;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--muted);font-size:13px;margin-top:4px}
.container{max-width:1200px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.card h2{font-size:16px;margin-bottom:12px;color:var(--accent)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;margin-top:10px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#12141c;color:var(--text);font-size:14px;outline:none}
input:focus{border-color:var(--accent)}
.btn{padding:10px 18px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--accent2);color:#fff}
.btn-success{background:var(--success);color:#000}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.status{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}
.status.ok{color:var(--success)}
.status.err{color:var(--danger)}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px}
.video-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.video-card video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000}
.video-card .info{padding:12px}
.video-card .info .title{font-size:13px;font-weight:600;margin-bottom:4px;word-break:break-word}
.video-card .info .meta{font-size:11px;color:var(--muted)}
.video-card .actions{padding:0 12px 12px;display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;background:var(--accent2);color:#fff}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:8px}
.tab{padding:8px 16px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;font-size:13px;font-weight:500}
.tab.active{background:var(--card);color:var(--text)}
.tab-content{display:none}
.tab-content.active{display:block}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="header">
  <h1>⚽ Football Clip Desk</h1>
  <p>Generate, preview and post football highlight clips</p>
</div>
<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="showTab('create')">Create</button>
    <button class="tab" onclick="showTab('library')">Library</button>
    <button class="tab" onclick="showTab('settings')">Settings</button>
  </div>

  <div id="create" class="tab-content active">
    <div class="grid">
      <div class="card">
        <h2>🎬 Generate Clip</h2>
        <label>Search Query</label>
        <input id="query" value="Ibrahim Maza" placeholder="Player or team name">
        <label>Time Window (hours)</label>
        <select id="hours">
          <option value="6">6 hours</option>
          <option value="12">12 hours</option>
          <option value="24" selected>24 hours</option>
          <option value="48">48 hours</option>
          <option value="72">72 hours</option>
        </select>
        <label>Video URL (optional, for clip cutting)</label>
        <input id="url" placeholder="https://youtube.com/watch?v=...">
        <select id="limit">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="30" selected>30</option>
          <option value="50">50</option>
        </select>
        <div class="row">
          <button class="btn btn-primary" onclick="create()">Create Clip</button>
          <span id="createStatus" class="status"></span>
        </div>
      </div>
      <div class="card">
        <h2>🔗 Connections</h2>
        <label>Facebook Page Access Token</label>
        <input id="fb" type="password" placeholder="EAAG...">
        <label>Facebook Page ID</label>
        <input id="pageId" placeholder="123456789">
        <div class="row">
          <button class="btn btn-secondary btn-sm" onclick="check()">Check Connection</button>
          <span id="conn" class="status"></span>
        </div>
        <div style="margin-top:16px;padding:12px;background:#12141c;border-radius:8px;font-size:12px;color:var(--muted)">
          <strong style="color:var(--text)">YouTube upload:</strong> Not wired yet. Use the Facebook posting for now.
        </div>
      </div>
    </div>
  </div>

  <div id="library" class="tab-content">
    <div class="card">
      <h2>📁 Video Library</h2>
      <div class="row" style="margin-bottom:12px">
        <input id="search" placeholder="Filter videos..." style="max-width:300px" oninput="filterVideos()">
        <button class="btn btn-secondary btn-sm" onclick="loadVideos()">Refresh</button>
      </div>
      <div id="videoGrid" class="video-grid"></div>
      <div id="emptyState" class="empty" style="display:none">No videos yet. Create your first clip!</div>
    </div>
  </div>

  <div id="settings" class="tab-content">
    <div class="card">
      <h2>⚙️ Settings</h2>
      <label>Default Query</label>
      <input id="defaultQuery" value="Football">
      <label>Clip Duration (seconds)</label>
      <select id="clipDur">
        <option value="7">7s</option>
        <option value="15">15s</option>
        <option value="30" selected>30s</option>
        <option value="60">60s</option>
      </select>
      <label>Output Resolution</label>
      <select id="resolution">
        <option value="1080x1920" selected>1080x1920 (Vertical)</option>
        <option value="1920x1080">1920x1080 (Horizontal)</option>
        <option value="720x1280">720x1280 (Vertical SD)</option>
      </select>
      <div class="row">
        <button class="btn btn-primary btn-sm" onclick="saveSettings()">Save Settings</button>
        <span id="settingsStatus" class="status"></span>
      </div>
    </div>
  </div>
</div>

<script>
function showTab(t){
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(t).classList.add('active');
  if(t==='library') loadVideos();
}
function check(){
  const el=document.getElementById('conn'); el.textContent='Checking...'; el.className='status';
  fetch('/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fb:document.getElementById('fb').value})})
    .then(r=>r.json()).then(d=>{el.textContent=d.msg;el.className='status '+(d.ok?'ok':'err')})
    .catch(e=>{el.textContent=e;el.className='status err'});
}
function create(){
  const el=document.getElementById('createStatus'); el.textContent='Creating...'; el.className='status';
  const btn=event.target; btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
  fetch('/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:document.getElementById('query').value,url:document.getElementById('url').value})})
    .then(r=>r.json()).then(d=>{el.textContent=d.msg;el.className='status '+(d.ok?'ok':'err')})
    .catch(e=>{el.textContent=e;el.className='status err'})
    .finally(()=>{btn.disabled=false;btn.textContent='Create Clip'});
}
let allVideos=[];
function loadVideos(){
  fetch('/').then(r=>r.text()).then(html=>{
    // parse video links from directory listing is not available; use known pattern
  });
  // Fetch video list via a simple approach: try common filenames
  const grid=document.getElementById('videoGrid'); grid.innerHTML='<div class="spinner"></div>';
  // We'll list files by trying to fetch directory - fallback to showing known clips
  fetch('/api/videos').then(r=>r.json()).then(d=>{
    allVideos=d.videos||[];
    renderVideos(allVideos);
  }).catch(()=>{
    grid.innerHTML=''; document.getElementById('emptyState').style.display='block';
  });
}
function renderVideos(list){
  const grid=document.getElementById('videoGrid'); const empty=document.getElementById('emptyState');
  if(!list.length){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  grid.innerHTML=list.map(v=>`
    <div class="video-card">
      <video controls preload="metadata" src="${v}"></video>
      <div class="info"><div class="title">${v}</div><div class="meta">${v.split('.').pop().toUpperCase()}</div></div>
      <div class="actions">
        <button class="btn btn-success btn-sm" onclick="post('${v}','fb')">Post FB</button>
        <button class="btn btn-secondary btn-sm" onclick="download('${v}')">Download</button>
      </div>
    </div>`).join('');
}
function filterVideos(){
  const q=document.getElementById('search').value.toLowerCase();
  renderVideos(allVideos.filter(v=>v.toLowerCase().includes(q)));
}
function post(n,p){
  if(p!=='fb') return alert('YouTube upload not wired yet');
  const pid=document.getElementById('pageId').value||prompt('Facebook Page ID?');
  if(!pid) return;
  fetch('/post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fb:document.getElementById('fb').value,page_id:pid,file:n,desc:'Football highlights clip'})})
    .then(r=>r.json()).then(d=>alert(d.msg)).catch(e=>alert(e));
}
function download(n){const a=document.createElement('a');a.href=n;a.download=n;a.click();}
function saveSettings(){document.getElementById('settingsStatus').textContent='Saved!';document.getElementById('settingsStatus').className='status ok';}
loadVideos();
</script>
</body>
</html>
